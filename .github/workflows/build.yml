name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Select preset
        id: preset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "name=windows-debug" >> "$GITHUB_OUTPUT" ;;
            macos-latest)   echo "name=macos-debug"   >> "$GITHUB_OUTPUT" ;;
            ubuntu-latest)  echo "name=linux-debug"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install vulkan-sdk --version 1.3.296.0 -y --no-progress 2>&1 | Out-Null
          $sdkPath = "C:\VulkanSDK\1.3.296.0"
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkPath"
          Add-Content -Path $env:GITHUB_PATH -Value "$sdkPath\Bin"

      - name: Install Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          brew update
          brew install molten-vk vulkan-headers shaderc
          echo "VULKAN_SDK=$(brew --prefix vulkan-headers)" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.296-jammy.list \
            https://packages.lunarg.com/vulkan/1.3.296/lunarg-vulkan-1.3.296-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk glslc

      - name: Configure CMake
        run: cmake --preset=${{ steps.preset.outputs.name }}

      - name: Build
        run: cmake --build build/${{ steps.preset.outputs.name }}
