name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Select preset
        id: preset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "name=windows-ci-debug" >> "$GITHUB_OUTPUT" ;;
            macos-latest)   echo "name=macos-debug"   >> "$GITHUB_OUTPUT" ;;
            ubuntu-latest)  echo "name=linux-debug"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Setup Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $base = "C:\VulkanSDK"
          $sdkPath = $null
          if (Test-Path $base) {
            $dirs = Get-ChildItem -Path $base -Directory | Sort-Object Name -Descending
            foreach ($d in $dirs) {
              $testPath = Join-Path $d.FullName "Include\vulkan\vulkan.h"
              if (Test-Path $testPath) { $sdkPath = $d.FullName; break }
            }
          }
          if (-not $sdkPath) {
            choco install vulkan-sdk -y --no-progress --force 2>&1
            if (Test-Path $base) {
              $dirs = Get-ChildItem -Path $base -Directory | Sort-Object Name -Descending
              foreach ($d in $dirs) {
                $testPath = Join-Path $d.FullName "Include\vulkan\vulkan.h"
                if (Test-Path $testPath) { $sdkPath = $d.FullName; break }
              }
            }
          }
          if ($sdkPath) {
            Write-Host "Vulkan SDK found at $sdkPath"
            Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkPath"
            Add-Content -Path $env:GITHUB_PATH -Value "$sdkPath\Bin"
          } else {
            Write-Error "Failed to find/install Vulkan SDK"
            exit 1
          }

      - name: Setup Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install molten-vk vulkan-headers shaderc
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Setup Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          # Try to get glslc via LunarG repo (best-effort)
          sudo apt-get install -y gnupg 2>/dev/null || true
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor --yes -o /usr/share/keyrings/lunarg-archive-keyring.gpg 2>/dev/null || true
          CODENAME=$(lsb_release -cs 2>/dev/null || echo "jammy")
          echo "deb [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg] https://packages.lunarg.com/vulkan/1.3.296/ubuntu $CODENAME main" | \
            sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list 2>/dev/null || true
          sudo apt-get update 2>/dev/null || true
          sudo apt-get install -y glslc 2>/dev/null || echo "glslc not found via LunarG"
          which glslc || echo "glslc not found — shaders won't compile at build time"

      - name: Set up MSVC build environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          # Windows CI builds with MSVC (cl) — same compiler as the local
          # windows-debug preset. Without this the Ninja generator falls back to
          # the MinGW that happens to be on the runner image.
          COMPILER_ARGS=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            COMPILER_ARGS="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"
          fi
          cmake --preset=${{ steps.preset.outputs.name }} -DLEIR_BUILD_TESTS=ON $COMPILER_ARGS

      - name: Build
        run: cmake --build build/${{ steps.preset.outputs.name }}

      - name: Test
        shell: bash
        run: |
          BUILD_DIR="build/${{ steps.preset.outputs.name }}"
          # Add engine library dir to loader path so tests can find LeirEngine
          case "${{ matrix.os }}" in
            windows-latest)
              export PATH="$BUILD_DIR/engine:$PATH"
              ;;
            macos-latest)
              export DYLD_LIBRARY_PATH="$BUILD_DIR/engine:$DYLD_LIBRARY_PATH"
              ;;
            ubuntu-latest)
              export LD_LIBRARY_PATH="$BUILD_DIR/engine:$LD_LIBRARY_PATH"
              ;;
          esac
          ctest --output-on-failure --test-dir "$BUILD_DIR" --timeout 120

  # Fase 6 / M2 (see TODO_WEB_EXPORT.md): compile-only validation of the
  # full-web-engine demo on Emscripten + WebGPU. No browser test (headless
  # WebGPU is flaky); linking WebEngineDemo.wasm proves the engine subset
  # (WebGPUBackend, CoreApplication loop, Scene/UI/Font, Physics stub)
  # compiles for wasm32 and the emdawnwebgpu JS glue resolves.
  emscripten:
    name: Emscripten (WebEngineDemo M2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten 6.0.6
        shell: bash
        run: |
          git clone --depth 1 --branch 6.0.6 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.6
          "$HOME/emsdk/emsdk" activate 6.0.6
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake -S examples/WebEngineDemo -B build/emscripten-webengine -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"

      - name: Build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --build build/emscripten-webengine

      - name: Assert artifacts
        shell: bash
        run: |
          test -f build/emscripten-webengine/WebEngineDemo.wasm
          test -f build/emscripten-webengine/WebEngineDemo.js
          test -f build/emscripten-webengine/WebEngineDemo.data
