name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Select preset
        id: preset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "name=windows-debug" >> "$GITHUB_OUTPUT" ;;
            macos-latest)   echo "name=macos-debug"   >> "$GITHUB_OUTPUT" ;;
            ubuntu-latest)  echo "name=linux-debug"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Setup Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $sdkRoot = "C:\VulkanSDK"
          if (Test-Path $sdkRoot) {
            $version = Get-ChildItem $sdkRoot | Sort-Object Name -Descending | Select-Object -First 1
            $sdkPath = Join-Path $sdkRoot $version.Name
            Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkPath"
            Add-Content -Path $env:GITHUB_PATH -Value "$sdkPath\Bin"
            Write-Host "Found Vulkan SDK at $sdkPath"
          } else {
            choco install vulkan-sdk -y --no-progress 2>&1 | Out-Null
            if (Test-Path $sdkRoot) {
              $version = Get-ChildItem $sdkRoot | Sort-Object Name -Descending | Select-Object -First 1
              $sdkPath = Join-Path $sdkRoot $version.Name
              Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkPath"
              Add-Content -Path $env:GITHUB_PATH -Value "$sdkPath\Bin"
            }
          }

      - name: Setup Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install molten-vk vulkan-headers shaderc
          VK_SDK=$(brew --prefix vulkan-headers)
          echo "VULKAN_SDK=${VK_SDK}" >> "$GITHUB_ENV"

      - name: Setup Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor --yes -o /usr/share/keyrings/lunarg-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg] https://packages.lunarg.com/vulkan/1.3.296 jammy main" | \
            sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Configure CMake
        run: cmake --preset=${{ steps.preset.outputs.name }}

      - name: Build
        run: cmake --build build/${{ steps.preset.outputs.name }}

      - name: Test
        run: cmake --build build/${{ steps.preset.outputs.name }} --target test 2>&1 || echo "No test target"
